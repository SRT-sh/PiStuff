<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SRT Telemetry · Local CSV viewer</title>
<style>/*__SHARED_CSS__*/</style>
<style>
.desktop-masthead{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 3.4%;background:var(--surface);border-top:6px solid var(--crimson);border-bottom:1px solid var(--line)}.desktop-brand img{width:260px;max-width:100%;height:auto}.desktop-masthead span{color:var(--muted);font-size:13px}.desktop-workspace{border:0;margin:20px 0 0;padding:0;min-width:0}.desktop-toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}.desktop-toolbar h1{margin:0;font-size:24px}.desktop-file-count{font-size:13px;color:var(--muted);margin-left:12px}.desktop-file-list{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:18px 0 0}.desktop-file-list:empty{display:none}.desktop-file{display:flex;align-items:center;gap:8px;max-width:100%;padding:5px 6px 5px 12px;background:var(--soft);border:1px solid var(--line);border-radius:3px;font-size:12px}.desktop-file-name{min-width:0;overflow-wrap:anywhere}.desktop-file-remove{flex-shrink:0;min-height:28px;width:28px;padding:0;border:0;background:transparent;color:var(--muted);font-size:20px;font-weight:400}.desktop-file-remove:hover{background:var(--line);color:var(--ink)}.desktop-combine{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:16px}.desktop-combine input{flex-shrink:0}#desktopStatus{font-size:13px;margin:14px 0 0;overflow-wrap:anywhere}#desktopTimeline .section-heading{margin-bottom:16px}#desktopTimeline .section-heading h2{margin:0}
@media(pointer:coarse){.desktop-file-remove{min-height:44px;width:44px}}
.desktop-mapping{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}.desktop-mapping .desktop-file-list{margin:0}.desktop-mapping>button{font-size:13px;min-height:38px;padding:8px 14px}
.graph-tabs{display:flex;gap:5px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:7px;margin:20px 0 12px}.graph-tabs button{min-height:36px;font-size:13px;padding:7px 15px}.graph-tabs [aria-selected=true]{background:var(--ink);border-color:var(--ink);color:white}.graph-tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.graph-tools button{min-height:36px;padding:6px 12px}.graph-group-name{width:160px;min-width:0;font-weight:600;margin:0}.graph-navigation{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-left:auto}.graph-navigation select{margin:0;width:auto;min-height:36px;font-size:12px;padding:6px 24px 6px 8px}#timelinePlots{display:grid;gap:12px}#timelinePlots .graph-panel{padding:0;border-top:1px solid #364252}.graph-panel{background:#151d28;border:1px solid #364252;border-left:3px solid #364252;border-radius:4px;overflow:hidden;min-width:0;color:#e3eaf4}.graph-panel.is-active{border-left-color:#41c8ff}.graph-heading{display:flex;gap:6px;align-items:center;padding:7px 10px;border-bottom:1px solid #303b49}.graph-heading input{min-width:0;width:100%;margin:0;padding:3px 4px;background:transparent;border:1px solid transparent;color:#e3eaf4;font-size:13px;font-weight:600;min-height:32px}.graph-heading input:focus{border-color:#7290ad}.graph-heading button,.graph-legends button{background:transparent;color:#aebed1;border:0;min-height:30px;padding:3px 8px;font-size:12px;white-space:nowrap}.graph-heading button:hover,.graph-legends button:hover{background:#303b49;color:white}.graph-legends{display:flex;gap:6px 16px;flex-wrap:wrap;padding:8px 14px 0}.graph-channel{display:grid;grid-template-columns:18px minmax(0,auto) auto 22px;align-items:center;column-gap:7px;min-width:0;max-width:100%;border-bottom:1px solid #303b49;padding-bottom:4px}.graph-channel input[type=color]{appearance:none;width:18px;min-width:18px;height:22px;min-height:0;margin:0;padding:0;border:0;background:transparent;cursor:pointer}.graph-channel input[type=color]::-webkit-color-swatch-wrapper{padding:3px 0}.graph-channel input[type=color]::-webkit-color-swatch{border:0;border-radius:2px}.graph-channel .graph-channel-name{color:var(--trace);padding:0;text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:500}.graph-channel-name[aria-pressed=true]{text-decoration:underline;text-underline-offset:4px}.graph-channel output{font-size:13px;color:var(--trace);font-variant-numeric:tabular-nums;white-space:nowrap}.graph-scale{grid-column:2/4;grid-row:2;color:#97a7bb;font-size:10px;font-variant-numeric:tabular-nums}.graph-channel .graph-channel-remove{grid-column:4;grid-row:1/3;padding:0;font-size:18px}.graph-panel canvas{background:#151d28;border:0;border-radius:0;display:block;width:100%;height:220px;touch-action:none;cursor:crosshair}.graph-panel canvas:focus-visible{outline:2px solid #41c8ff;outline-offset:-2px}
@media(max-width:580px){.graph-navigation{margin-left:0;width:100%}.graph-tools{gap:5px}.graph-channel{column-gap:5px}.graph-legends{padding-left:8px;padding-right:8px}.graph-heading{padding-left:6px;padding-right:6px}.graph-heading button{padding-left:6px;padding-right:6px}}
@media(max-width:580px){.desktop-masthead{display:block;padding:18px}.desktop-masthead span{display:block;margin-top:12px}.desktop-brand img{width:230px}}
</style></head><body>
<a class="skip" href="#main">Skip to content</a>
<header class="desktop-masthead"><div class="desktop-brand"><img src="/*__LOGO__*/" alt="Sooner Racing Team"></div><span>Telemetry</span></header>
<main id="main">
<section class="panel desktop-import">
<div class="desktop-toolbar"><div><h1>CSV viewer<span id="desktopFileCount" class="desktop-file-count">0 files</span></h1></div><button id="desktopAdd" type="button">Add files</button></div>
<input id="desktopFiles" type="file" multiple accept=".csv,text/csv" aria-label="Add CSV files" hidden>
<ul id="desktopFileList" class="desktop-file-list" aria-label="Added files"></ul>
<div class="desktop-mapping"><button id="desktopMapAdd" type="button" class="secondary">Add CAN mapping</button><input id="desktopMapFile" type="file" accept=".csv,text/csv" aria-label="Upload motec_can_signal_map.csv" hidden><ul id="desktopMapList" class="desktop-file-list" aria-label="CAN mapping"></ul></div>
<label class="desktop-combine" hidden><input id="desktopCombine" type="checkbox">Combine into one run</label>
<p id="desktopStatus" role="status" hidden></p></section>
<fieldset id="desktopWorkspace" class="desktop-workspace">
<section id="desktopTimeline" class="panel" hidden>
<div class="section-heading"><h2>Analysis</h2></div>
<label>Imported run<select id="timelineSession"><option value="">Choose an imported run</option></select></label>
<p id="timelineStatus" role="status">Choose an imported run.</p>
<div id="timelineControls" hidden>
<div id="timelineWarnings" class="notice" hidden></div>
<div id="timelineGraphTools"></div>
<details><summary id="timelineChannelSummary">Choose channels</summary><label>Find a channel<input id="timelineSearch" type="search" placeholder="RPM, steering, flow, acceleration…"></label><div id="timelineChannels" class="timeline-channels"></div></details>
<form id="timelineWindow" class="filters timeline-window">
<label>Start (s)<input id="timelineStart" type="number" min="0" step="any" required></label>
<label>End (s)<input id="timelineEnd" type="number" min="0" step="any" required></label>
<label hidden>Maximum sample age (s)<input id="timelineGap" type="number" min="0.001" max="10" step="any" value="0.25" required></label>
<button id="timelineApply" type="submit">Update plots</button><button id="timelineFull" type="button" class="secondary">Whole run</button>
</form>
<div class="timeline-inspection"><label>Inspect time (s)<input id="timelineCursor" type="range" step="0.001" min="0" max="1" value="0"></label><output id="timelineTime">0.000 s</output></div>
<div id="timelinePlots" class="timeline-plots"></div>
<div class="actions"><label>CSV sample rate (Hz)<input id="timelineHz" type="number" min="1" max="200" value="50" step="any"></label><label class="timeline-all"><input id="timelineAll" type="checkbox">Include all recorded numeric channels</label><button id="timelineExport" type="button" class="secondary">Download combined CSV</button></div>
</div></section></fieldset>
</main>
<script id="desktopWorker" type="text/plain">/*__CSV_WORKER__*/</script>
<script>/*__GRAPHS_JS__*/</script>
<script>/*__TIMELINE_JS__*/</script>
<script>/*__DESKTOP_JS__*/</script>
</body></html>
